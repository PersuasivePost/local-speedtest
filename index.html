<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Speed Test</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }
      #container {
        background: #ffffff;
        padding: 2rem;
        border-radius: 12px;
        border: 1px solid #000000;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        width: 100%;
        box-sizing: border-box;
      }
      h1 {
        text-align: center;
        margin-bottom: 1.5rem;
        font-size: 1.8rem;
      }
      .ip-section {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .ip-section div {
        font-weight: bold;
      }
      button {
        font-size: 1rem;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        border: 1px solid #000000;
        background: #000000;
        color: #ffffff;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #333333;
      }
      button:disabled {
        background: #cccccc;
        color: #666666;
        cursor: not-allowed;
      }
      .start-button {
        width: 100%;
        margin-bottom: 1.5rem;
      }
      .progress-section {
        margin-bottom: 1.5rem;
      }
      .progress-section label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: bold;
      }
      progress {
        width: 100%;
        height: 20px;
        border-radius: 4px;
        border: 1px solid #000000;
      }
      .progress-info {
        display: flex;
        justify-content: space-between;
        margin-top: 0.5rem;
        font-size: 0.9rem;
      }
      pre {
        background: #f9f9f9;
        padding: 1rem;
        border-radius: 8px;
        border: 1px solid #cccccc;
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        max-height: 300px;
        overflow-y: auto;
      }
      @media (max-width: 768px) {
        #container {
          padding: 1rem;
          margin: 1rem;
        }
        h1 {
          font-size: 1.5rem;
        }
        button {
          font-size: 0.9rem;
          padding: 0.6rem 1.2rem;
        }
        .ip-section {
          flex-direction: column;
          align-items: flex-start;
        }
        .progress-info {
          flex-direction: column;
          gap: 0.25rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Local Network Speed Test</h1>
      <div class="ip-section">
        <div id="ipContainer">PC IP: <span id="pcIp">(unknown)</span></div>
        <button id="copyIpButton" title="Copy IP" disabled>Copy IP</button>
      </div>

      <button id="startButton" class="start-button">Start Test</button>

      <div class="progress-section">
        <label for="dlProgress">Download Progress</label>
        <progress id="dlProgress" value="0" max="100"></progress>
        <div class="progress-info">
          <div id="dlSpeed">Speed: —</div>
          <div id="dlReceived">Received: —</div>
        </div>
      </div>

      <pre id="results"></pre>
    </div>
    <script src="script.js"></script>
  </body>
</html>
